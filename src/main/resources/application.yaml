spring:
  application:
    name: gestao_equipamentos

  datasource:
    url: jdbc:h2:file:./data/project
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    

  jpa:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081
  error:
    include-message: always

api:
  security:
    token:
      secret: ${JWT_SECRET}
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}

logging:
  level:
    org.springframework.security: TRACE